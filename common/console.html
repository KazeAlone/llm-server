<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Server</title>
<style>body{font:16px system-ui;background:#f5f3ee;color:#292720;max-width:1100px;margin:32px auto;padding:0 20px}input,textarea,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:7px}textarea{width:95%;height:90px}button{cursor:pointer;background:#40382e;color:white;margin:10px 8px 10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:10px}label{display:inline-block;margin:8px}small{color:#666}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}@media(max-width:800px){.grid{display:block}}</style>
<h1>LLM Server</h1><p>本机聊天与运行监控</p><label>API 密钥 <input id="key" type="password" placeholder="与后端 .env 一致"></label><label>Model ID <input id="model" value="qwen3.8-27b"></label><button id="check">刷新监控</button><div class="grid"><section><pre id="chat">准备就绪</pre><textarea id="prompt" placeholder="输入问题"></textarea><p><input id="image" type="file" accept="image/*"> <small>可选图片，以 base64 发送</small></p><label>最大输出 <input id="tokens" type="number" value="512" min="1" max="8192"></label><button id="send">发送</button><button id="clear">清空对话</button><p id="timing"></p></section><section><h3>状态 / 显卡</h3><pre id="health">待刷新</pre><pre id="gpu"></pre><h3>后端指标</h3><pre id="metrics"></pre></section></div>
<script>
const $=id=>document.getElementById(id);let history=[];
const headers=()=>({'Content-Type':'application/json',Authorization:'Bearer '+$('key').value});
async function monitor(){for(const [path,id] of [['/health','health'],['/__gpu','gpu'],['/metrics','metrics']]){try{let r=await fetch(path,{headers:headers()});let t=await r.text();$(id).textContent=(r.ok?'':'HTTP '+r.status+'\n')+t.slice(0,6000)}catch(e){$(id).textContent=e.message}}}
$('check').onclick=monitor;$('clear').onclick=()=>{history=[];$('chat').textContent='对话已清空'};
$('send').onclick=async()=>{let text=$('prompt').value;if(!text)return;$('send').disabled=true;let start=performance.now(),first=null,answer='';let content=[{type:'text',text}];try{if($('image').files[0]){let f=$('image').files[0];if(f.size>20*1024*1024)throw Error('图片最大 20MiB');let url=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});content.push({type:'image_url',image_url:{url}})}history.push({role:'user',content});$('chat').textContent+='\n\n你：'+text+'\n\n模型：';let response=await fetch('/v1/chat/completions',{method:'POST',headers:headers(),body:JSON.stringify({model:$('model').value,messages:history,max_tokens:Number($('tokens').value),stream:true})});if(!response.ok)throw Error('HTTP '+response.status+' '+await response.text());let reader=response.body.getReader(),decoder=new TextDecoder(),pending='';while(true){let {value,done}=await reader.read();if(done)break;pending+=decoder.decode(value,{stream:true});let lines=pending.split('\n');pending=lines.pop();for(let line of lines){if(!line.startsWith('data:'))continue;let data=line.slice(5).trim();if(!data||data==='[DONE]')continue;let obj=JSON.parse(data);if(obj.error)throw Error(obj.error.message);let delta=obj.choices?.[0]?.delta||{};let piece=delta.reasoning_content||delta.reasoning||delta.content||'';if(piece){if(first===null)first=performance.now();answer+=piece;$('chat').textContent+=piece}}}history.push({role:'assistant',content:answer});$('prompt').value='';$('image').value='';$('timing').textContent='总耗时 '+((performance.now()-start)/1000).toFixed(2)+'s · 首个文本 '+(first===null?'无':((first-start)/1000).toFixed(2)+'s');}catch(e){$('chat').textContent+='\n错误：'+e.message;if(history.at(-1)?.role==='user')history.pop()}finally{$('send').disabled=false;monitor()}};
</script></html>
